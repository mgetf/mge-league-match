name: Autobuild

on:
  push:
    tags:
    - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to publish this build as (e.g. v0.1.0)'
        required: true
        type: string

jobs:
  run:
    name: Run action
    runs-on: ubuntu-latest
    permissions:
      contents: write

    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[ci skip]') }}

    steps:
    - uses: actions/checkout@v4

    - name: Checkout MGEMod include
      uses: actions/checkout@v4
      with:
        repository: mgetf/MGEMod
        path: deps/MGEMod
        sparse-checkout: |
          addons/sourcemod/scripting/include/mge.inc
        sparse-checkout-cone-mode: false

    - name: Setup SourcePawn Compiler
      uses: rumblefrog/setup-sp@master
      with:
        version: "1.12.x"

    - name: Compile plugins
      run: |
        mkdir -p plugins
        spcomp -i"./scripting/include" -i"./deps/MGEMod/addons/sourcemod/scripting/include" scripting/mge_league_match.sp -o ./plugins/mge_league_match.smx
        test -s plugins/mge_league_match.smx
        ls -la plugins/

    - name: Zip packages
      run: |
        mkdir build
        7za a -r build/mge-league-match.zip plugins/ translations/
        unzip -l build/mge-league-match.zip
        test "$(unzip -Z1 build/mge-league-match.zip | grep -c '\.smx$')" -ge 1

    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      with:
        tag_name: ${{ github.event.inputs.tag || github.ref_name }}
        files: |
          ./build/mge-league-match.zip
        fail_on_unmatched_files: true
        generate_release_notes: true
